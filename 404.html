<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando...</title>
  <script>
    const path = window.location.pathname;
    const match = path.match(/\/track\/([^\/]+)/);
    
    if (match) {
      const track = match[1];
      window.location.href = '/naldoamusic/?track=' + encodeURIComponent(track);
    } else {
      window.location.href = '/naldoamusic/';
    }
  </script>
</head>
<body>
  <p>Redirecionando...</p>
</body>
</html>
